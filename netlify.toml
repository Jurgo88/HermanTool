# Netlify build configuration (Part 4 §14.0, D-25 §14.2).
#
# Explicit rather than relying on Netlify's zero-config framework
# auto-detection: a deploy log showed "Detected 1 framework(s): nuxt...
# No build steps found, continuing to publishing" — detection recognised
# Nuxt but never invoked a build, so nothing was ever built or deployed
# (0 files, 0 functions uploaded), producing a 404 on every route.
#
# Node version is NOT set here — .nvmrc already pins it (D-25's Node 26
# pin) and the build log confirms Netlify reads it correctly on its own.
#
# publish = "dist", not ".output/public": that's Nitro's output path for
# other presets (e.g. node-server, used by a plain local `pnpm build`),
# but the `netlify` preset — auto-selected when NETLIFY=true is set,
# which Netlify's own build environment does automatically — puts static
# assets in `dist/` and the server function in
# `.netlify/functions-internal/`. Verified locally by building with
# NETLIFY=true set and inspecting the actual output directories, not
# just trusting Netlify's own suggested fix.
[build]
  command = "pnpm build"
  publish = "dist"
