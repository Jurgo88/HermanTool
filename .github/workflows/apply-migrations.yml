# Apply database migrations on merge to main (D-30). Migrations are files
# in this repo, reviewed in the diff, applied by GitHub Actions — never
# from a developer's laptop, never typed into the Supabase dashboard
# (Part 4 §14.7). Expand/contract only (CLAUDE.md) — no single migration
# in this repo is destructive in one step.
#
# Requires one repo-level secret, set once by the Tenant/developer (not
# by this workflow):
#   - secrets.SUPABASE_DB_URL — the Postgres connection string for the
#     TARGET project. Currently the same transaction-pooler connection
#     string as NUXT_DATABASE_URL (Netlify, D-25 §14.2) — verified
#     directly (`supabase db push --db-url`, run by hand against this
#     project) that the pooler connection works fine for the CLI's
#     migration push; no separate session-mode string turned out to be
#     necessary. Only one Supabase project exists at the time of writing
#     (no rehearsal project yet, R-05) — this secret therefore points at
#     the same database the application itself runs against, so every
#     migration merged to main takes effect immediately, not on a delay.
#
# Runs only when migration files actually change, and only on `main` — a
# migration is never applied speculatively from a feature branch. Once a
# second (rehearsal) Supabase project exists, rehearse there first — a
# separate, not-yet-built step this workflow does not perform.
name: Apply database migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending migrations
        run: |
          npx --yes supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}" --include-all
